<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard OKRs — Contabilidade Facilitada</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2336;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text2: #8a8fa8;
    --text3: #555c78;
    --blue: #378ADD;
    --blue-light: #85B7EB;
    --green: #1D9E75;
    --amber: #EF9F27;
    --red: #E24B4A;
    --pink: #D4537E;
    --purple: #7F77DD;
    --gray: #888780;
    --radius: 10px;
    --radius-sm: 6px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 0.5px solid var(--border); }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-badge { width: 36px; height: 36px; border-radius: 8px; background: var(--blue); display: flex; align-items: center; justify-content: center; }
  .logo-badge svg { width: 20px; height: 20px; fill: #fff; }
  .header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  .header .subtitle { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .last-updated { font-size: 11px; color: var(--text3); }

  /* API Setup */
  .api-card { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; }
  .api-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .api-card p { font-size: 13px; color: var(--text2); margin-bottom: 1rem; line-height: 1.6; }
  .api-card p a { color: var(--blue-light); }
  .api-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .api-row input { flex: 1; min-width: 200px; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 9px 12px; outline: none; }
  .api-row input:focus { border-color: var(--blue); }
  .btn { padding: 9px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-outline { background: transparent; color: var(--text); border: 0.5px solid var(--border2); }
  .btn-outline:hover { background: var(--bg3); opacity: 1; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .error { font-size: 12px; color: var(--red); margin-top: 8px; }

  /* Filters */
  .filters-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
  .filters-bar select { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 7px 10px; cursor: pointer; outline: none; }
  .filters-bar select:focus { border-color: var(--blue); }
  .filters-bar label { font-size: 12px; color: var(--text2); }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .refresh-btn { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Metrics */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric-card { background: var(--bg2); border-radius: var(--radius); padding: 1.1rem 1.25rem; border: 0.5px solid var(--border); }
  .metric-card .m-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .metric-card .m-value { font-size: 32px; font-weight: 600; color: var(--text); line-height: 1; }
  .metric-card .m-sub { font-size: 12px; color: var(--text3); margin-top: 6px; }
  .metric-card.accent-green .m-value { color: var(--green); }
  .metric-card.accent-blue .m-value { color: var(--blue); }
  .metric-card.accent-amber .m-value { color: var(--amber); }

  /* Charts grid */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  .chart-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-card h3 { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1rem; }

  /* Status list */
  .status-list { display: flex; flex-direction: column; gap: 10px; }
  .status-row { display: grid; grid-template-columns: 1fr 2fr 36px 42px; align-items: center; gap: 10px; }
  .status-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .s-count { font-size: 13px; font-weight: 600; color: var(--text); text-align: right; }
  .s-pct { font-size: 11px; color: var(--text3); text-align: right; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Progress bar */
  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-track { width: 100%; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.5s ease; }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--text2); }

  /* State */
  .state { text-align: center; padding: 4rem 2rem; color: var(--text2); font-size: 14px; }
  .state svg { width: 40px; height: 40px; margin-bottom: 1rem; opacity: 0.3; }

  @media (max-width: 640px) {
    .charts-grid { grid-template-columns: 1fr; }
    .chart-card.full { grid-column: 1; }
    .header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z" opacity=".2"/><path d="M9 9h6v6H9z"/></svg>
      </div>
      <div>
        <h1>Dashboard de OKRs</h1>
        <div class="subtitle">Contabilidade Facilitada · Liderança</div>
      </div>
    </div>
    <div class="last-updated" id="last-updated">—</div>
  </div>

  <!-- API Setup -->
  <div class="api-card" id="api-setup">
    <h2>🔑 Conectar ao ClickUp</h2>
    <p>Informe sua API Key do ClickUp para carregar os dados em tempo real.<br>
    Você encontra em: <a href="https://app.clickup.com/settings/apps" target="_blank">Settings → Apps → API Token</a></p>
    <div class="api-row">
      <input type="password" id="api-key-input" placeholder="pk_xxxxxxxxxxxxx" />
      <button class="btn btn-primary" onclick="saveKeyAndLoad()">Conectar e carregar</button>
    </div>
    <div class="error" id="api-error" style="display:none;"></div>
  </div>

  <!-- Filters -->
  <div class="filters-bar" id="filters-bar" style="display:none;">
    <div class="filter-group">
      <label>Período</label>
      <select id="f-period" onchange="renderDashboard()">
        <option value="all">Todos</option>
        <option value="Q1">Q1</option>
        <option value="Q2" selected>Q2</option>
        <option value="Q3">Q3</option>
        <option value="Q4">Q4</option>
        <option value="Year">Year</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Time / Área</label>
      <select id="f-team" onchange="renderDashboard()">
        <option value="all">Todos os times</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Nível hierárquico</label>
      <select id="f-level" onchange="renderDashboard()">
        <option value="all">Todos os níveis</option>
        <option value="0">Nível 1 — Objectives (pai)</option>
        <option value="1">Nível 2 — KRs (subtarefas)</option>
        <option value="2">Nível 3 — Sub-KRs</option>
      </select>
    </div>
    <div class="refresh-btn">
      <button class="btn btn-outline btn-sm" onclick="loadData()" id="btn-refresh">
        <span id="refresh-icon">↺</span> Atualizar dados
      </button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">

    <!-- Progress geral -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progress-label-left">Progresso geral</span>
        <span id="progress-label-right">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid" id="metrics-row"></div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Status das OKRs</h3>
        <div class="status-list" id="status-list"></div>
      </div>
      <div class="chart-card">
        <h3>OKRs por time</h3>
        <div style="position:relative; width:100%; height:260px;">
          <canvas id="chart-team" role="img" aria-label="Quantidade de OKRs por time"></canvas>
        </div>
      </div>
      <div class="chart-card full">
        <h3>Distribuição por período</h3>
        <div class="legend" id="legend-period"></div>
        <div style="position:relative; width:100%; height:200px;">
          <canvas id="chart-period" role="img" aria-label="OKRs por período"></canvas>
        </div>
      </div>
    </div>

  </div>

  <div class="state" id="state-msg" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
    <div id="state-text"></div>
  </div>

</div>

<script>
// ───── CONFIG ─────
const WORKSPACE_ID = '90131718266';
// IDs das listas de OKR — ajuste se necessário
const OKR_LIST_IDS = [
  '901326920864', // CEO
  '901326920872', // Operações (COO)
  '901327299507', // Projetos e Processos
  '901326920907', // RH
  '901326920891', // Financeiro/Adm
  '901326920901', // Marketing
  '901326920887', // Inteligência de Dados e Inovação
  '901326920903', // Produtos
  '901326920912', // Suporte e CS
  '901326920879', // Comercial
];
// Para buscar TODAS as listas do folder OKRs automaticamente, deixe OKR_LIST_IDS vazio []
// e preencha o FOLDER_ID abaixo:
const OKR_FOLDER_ID = '901318109049';

// ───── STATE ─────
let allTasks = [];
let chartTeam = null;
let chartPeriod = null;

// ───── UTILS ─────
function getApiKey() { return localStorage.getItem('cu_api_key') || ''; }

function fmt(n) { return n.toLocaleString('pt-BR'); }

function getFieldValue(task, fieldName) {
  const cf = (task.custom_fields || []).find(f => f.name === fieldName);
  if (!cf) return null;
  if (cf.type === 'drop_down') {
    if (cf.value == null) return null;
    const opt = (cf.type_config?.options || []).find(o => o.orderindex == cf.value);
    return opt ? opt.name : null;
  }
  if (cf.type === 'labels') {
    const ids = Array.isArray(cf.value) ? cf.value : [];
    const labels = (cf.type_config?.options || []).filter(o => ids.includes(o.id)).map(o => o.label);
    return labels;
  }
  return cf.value;
}

function getLevel(task) {
  if (!task.parent) return 0;
  if (!task.top_level_parent || task.top_level_parent === task.parent) return 1;
  return 2;
}

const LIST_NAME_MAP = {
  '901326920864': 'CEO',
  '901326920872': 'Operações',
  '901327299507': 'Projetos e Processos',
  '901326920907': 'RH',
  '901326920891': 'Financeiro',
  '901326920901': 'Marketing',
  '901326920887': 'Inteligência e Inovação',
  '901326920903': 'Produtos',
  '901326920912': 'Suporte e CS',
  '901326920879': 'Comercial',
};

function getTeam(task) {
  const areas = getFieldValue(task, 'Área (oficial)');
  if (Array.isArray(areas) && areas.length > 0) return areas[0];
  const listId = task.list?.id;
  if (listId && LIST_NAME_MAP[listId]) return LIST_NAME_MAP[listId];
  return task.list?.name || 'Sem área';
}

function isConcluded(task) {
  const s = (task.status?.status || '').toLowerCase();
  return task.status?.type === 'closed' || s.includes('concluí') || s.includes('concluido');
}

function setRefreshLoading(on) {
  const icon = document.getElementById('refresh-icon');
  if (icon) { icon.className = on ? 'spin' : ''; icon.textContent = '↺'; }
  const btn = document.getElementById('btn-refresh');
  if (btn) btn.disabled = on;
}

function showState(msg) {
  const el = document.getElementById('state-msg');
  const txt = document.getElementById('state-text');
  if (msg) { txt.textContent = msg; el.style.display = 'block'; } else { el.style.display = 'none'; }
}

// ───── API ─────
async function cuFetch(url) {
  const key = getApiKey();
  const res = await fetch(url, { headers: { Authorization: key, 'Content-Type': 'application/json' } });
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
  return res.json();
}

async function fetchListTasks(listId, page = 0, acc = []) {
  const url = `https://api.clickup.com/api/v2/list/${listId}/task?subtasks=true&include_closed=true&page=${page}&limit=100`;
  const data = await cuFetch(url);
  const tasks = data.tasks || [];
  acc.push(...tasks);
  if (tasks.length === 100) return fetchListTasks(listId, page + 1, acc);
  return acc;
}

async function fetchFolderLists(folderId) {
  const data = await cuFetch(`https://api.clickup.com/api/v2/folder/${folderId}/list`);
  return (data.lists || []).map(l => l.id);
}

async function loadData() {
  const key = getApiKey();
  if (!key) { document.getElementById('api-setup').style.display = 'block'; return; }
  setRefreshLoading(true);
  showState('Carregando dados do ClickUp...');
  document.getElementById('dashboard').style.display = 'none';

  try {
    let listIds = [...OKR_LIST_IDS];
    if (listIds.length === 0 && OKR_FOLDER_ID) {
      listIds = await fetchFolderLists(OKR_FOLDER_ID);
    }
    if (listIds.length === 0) throw new Error('Nenhuma lista configurada.');

    const results = await Promise.all(listIds.map(id => fetchListTasks(id)));
    allTasks = results.flat();

    if (allTasks.length === 0) { showState('Nenhuma tarefa encontrada. Verifique a API key ou as listas.'); setRefreshLoading(false); return; }

    // Preencher select de times
    const teams = [...new Set(allTasks.map(getTeam))].sort();
    const sel = document.getElementById('f-team');
    sel.innerHTML = '<option value="all">Todos os times</option>';
    teams.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o); });

    const now = new Date().toLocaleString('pt-BR');
    document.getElementById('last-updated').textContent = `Atualizado: ${now}`;

    showState('');
    document.getElementById('filters-bar').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'block';
    renderDashboard();
  } catch(e) {
    showState('Erro: ' + e.message);
    console.error(e);
  }
  setRefreshLoading(false);
}

function saveKeyAndLoad() {
  const k = document.getElementById('api-key-input').value.trim();
  if (!k) { document.getElementById('api-error').textContent = 'Informe a API key.'; document.getElementById('api-error').style.display = 'block'; return; }
  localStorage.setItem('cu_api_key', k);
  document.getElementById('api-setup').style.display = 'none';
  document.getElementById('api-error').style.display = 'none';
  loadData();
}

// ───── RENDER ─────
function getFiltered() {
  const period = document.getElementById('f-period').value;
  const team = document.getElementById('f-team').value;
  const level = document.getElementById('f-level').value;
  return allTasks.filter(t => {
    if (period !== 'all' && getFieldValue(t, 'Período') !== period) return false;
    if (team !== 'all' && getTeam(t) !== team) return false;
    if (level !== 'all' && getLevel(t) !== parseInt(level)) return false;
    return true;
  });
}

function renderDashboard() {
  const tasks = getFiltered();
  const total = tasks.length;
  const concluded = tasks.filter(isConcluded).length;
  const inProgress = tasks.filter(t => (t.status?.status || '').toLowerCase().includes('andamento')).length;
  const notStarted = tasks.filter(t => (t.status?.status || '').toLowerCase().includes('não iniciado')).length;
  const atRisk = tasks.filter(t => (t.status?.status || '').toLowerCase().includes('risco')).length;
  const pct = total > 0 ? Math.round(concluded / total * 100) : 0;

  // Progress bar
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label-left').textContent = `Progresso geral — ${fmt(concluded)} de ${fmt(total)} concluídas`;
  document.getElementById('progress-label-right').textContent = pct + '%';

  // Metrics
  document.getElementById('metrics-row').innerHTML = `
    <div class="metric-card"><div class="m-label">Total de OKRs</div><div class="m-value">${fmt(total)}</div><div class="m-sub">No filtro atual</div></div>
    <div class="metric-card accent-green"><div class="m-label">Concluídas</div><div class="m-value">${fmt(concluded)}</div><div class="m-sub">${pct}% do total</div></div>
    <div class="metric-card accent-blue"><div class="m-label">Em andamento</div><div class="m-value">${fmt(inProgress)}</div><div class="m-sub">${total > 0 ? Math.round(inProgress/total*100) : 0}% do total</div></div>
    <div class="metric-card accent-amber"><div class="m-label">Não iniciadas</div><div class="m-value">${fmt(notStarted)}</div><div class="m-sub">${total > 0 ? Math.round(notStarted/total*100) : 0}% do total</div></div>
    <div class="metric-card"><div class="m-label">Em risco / atrasadas</div><div class="m-value" style="color:var(--red)">${fmt(atRisk)}</div><div class="m-sub">${total > 0 ? Math.round(atRisk/total*100) : 0}% do total</div></div>
  `;

  // Status list
  const statusColors = {
    'concluído': '#1D9E75',
    'em andamento': '#378ADD',
    'não iniciado': '#888780',
    'em risco/ atrasado': '#E24B4A',
    'pausado': '#EF9F27',
    'cancelado': '#D4537E',
  };
  const statusMap = {};
  tasks.forEach(t => {
    const s = t.status?.status || 'Desconhecido';
    statusMap[s] = (statusMap[s] || 0) + 1;
  });
  const statusEntries = Object.entries(statusMap).sort((a,b) => b[1]-a[1]);
  document.getElementById('status-list').innerHTML = statusEntries.map(([name, count]) => {
    const pctS = total > 0 ? Math.round(count/total*100) : 0;
    const color = statusColors[name.toLowerCase()] || '#888780';
    return `<div class="status-row">
      <span class="status-name">${name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pctS}%; background:${color};"></div></div>
      <span class="s-count">${count}</span>
      <span class="s-pct">${pctS}%</span>
    </div>`;
  }).join('');

  // Chart: por time
  const teamMap = {};
  tasks.forEach(t => { const tm = getTeam(t); teamMap[tm] = (teamMap[tm] || 0) + 1; });
  const teamEntries = Object.entries(teamMap).sort((a,b) => b[1]-a[1]).slice(0, 14);
  const teamLabels = teamEntries.map(e => e[0]);
  const teamData = teamEntries.map(e => e[1]);
  const chartHeight = Math.max(260, teamEntries.length * 36 + 60);
  document.getElementById('chart-team').parentElement.style.height = chartHeight + 'px';

  if (chartTeam) chartTeam.destroy();
  chartTeam = new Chart(document.getElementById('chart-team'), {
    type: 'bar',
    data: {
      labels: teamLabels,
      datasets: [{ label: 'OKRs', data: teamData, backgroundColor: '#378ADD99', borderColor: '#378ADD', borderWidth: 1, borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw} OKRs` } } },
      scales: {
        x: { ticks: { color: '#8a8fa8', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#e8eaf0', font: { size: 12 }, autoSkip: false }, grid: { display: false } }
      }
    }
  });

  // Chart: por período
  const periodOrder = ['Q1','Q2','Q3','Q4','Year'];
  const periodColors = { Q1: '#7F77DD', Q2: '#378ADD', Q3: '#1D9E75', Q4: '#EF9F27', Year: '#888780' };
  const periodTotal = {};
  const periodDone = {};
  periodOrder.forEach(p => { periodTotal[p] = 0; periodDone[p] = 0; });
  allTasks.forEach(t => {
    const p = getFieldValue(t, 'Período');
    if (p && periodOrder.includes(p)) {
      periodTotal[p]++;
      if (isConcluded(t)) periodDone[p]++;
    }
  });

  document.getElementById('legend-period').innerHTML = periodOrder.map(p =>
    `<div class="legend-item"><span class="legend-dot" style="background:${periodColors[p]}"></span>${p} — ${periodTotal[p]} total · ${periodDone[p]} concluídas</div>`
  ).join('');

  if (chartPeriod) chartPeriod.destroy();
  chartPeriod = new Chart(document.getElementById('chart-period'), {
    type: 'bar',
    data: {
      labels: periodOrder,
      datasets: [
        { label: 'Total', data: periodOrder.map(p => periodTotal[p]), backgroundColor: periodOrder.map(p => periodColors[p] + '55'), borderColor: periodOrder.map(p => periodColors[p]), borderWidth: 1, borderRadius: 4 },
        { label: 'Concluídas', data: periodOrder.map(p => periodDone[p]), backgroundColor: periodOrder.map(p => periodColors[p]), borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.raw}` } }
      },
      scales: {
        x: { ticks: { color: '#e8eaf0', font: { size: 13 } }, grid: { display: false } },
        y: { ticks: { color: '#8a8fa8', font: { size: 11 }, stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

// ───── INIT ─────
if (getApiKey()) {
  document.getElementById('api-setup').style.display = 'none';
  loadData();
}
</script>
</body>
</html>
